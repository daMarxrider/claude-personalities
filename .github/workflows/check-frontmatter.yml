name: check-frontmatter
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Personas must keep coding instructions
        run: |
          fail=0
          for f in *.md; do
            case "$f" in README.md|CLAUDE.md) continue;; esac
            if ! awk 'NR==1 && $0!="---"{exit 1} NR>1 && $0=="---"{exit 0} NR>1 && /^keep-coding-instructions: *true *$/{found=1} END{exit !found}' "$f"; then
              echo "::error file=$f::missing frontmatter with 'keep-coding-instructions: true'"
              fail=1
            fi
          done
          exit $fail
